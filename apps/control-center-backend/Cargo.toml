[package]
name = "nyx-control-center-backend"
version = "0.1.0"
description = "Nyx Control Center without GTK: providers, layout, plugin tiles and Panel1, for its Quickshell interface"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nyx-control-center-backend"
path = "src/main.rs"

[dependencies]
async-channel = "2"
gio = "0.22"
glib = "0.22"
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "166ff17bdb09dd6c5f130fd28ecf81d1f8a59d2d" }
nyx-plugin = { git = "https://github.com/design-nexus/nyx-core.git", rev = "166ff17bdb09dd6c5f130fd28ecf81d1f8a59d2d" }
nyx-plugin-host = { git = "https://github.com/design-nexus/nyx-core.git", rev = "166ff17bdb09dd6c5f130fd28ecf81d1f8a59d2d" }
nyx-plugin-protocol = { git = "https://github.com/design-nexus/nyx-core.git", rev = "166ff17bdb09dd6c5f130fd28ecf81d1f8a59d2d" }
nyx-providers = { path = "../../crates/nyx-providers" }
nyx-theme-core = { git = "https://github.com/design-nexus/nyx-design.git", rev = "553f65567057150af4929033896531879528bbf4" }
nyx-ui-link = { git = "https://github.com/design-nexus/nyx-core.git", rev = "166ff17bdb09dd6c5f130fd28ecf81d1f8a59d2d" }
nyx-widgets = { path = "../../crates/nyx-widgets" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
