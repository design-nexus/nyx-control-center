[package]
name = "nyx-control-center"
version = "0.1.0"
description = "Nyx Control Center: quick settings for Omarchy and Hyprland"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
async-channel = "2"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
gtk4-layer-shell = "0.8"
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "44d4d4c8009259b4ea7d7d0f564319ea9a1ce684" }
# The plugin system: nyx-core, and its GTK drawing in nyx-design.
nyx-plugin = { git = "https://github.com/design-nexus/nyx-core.git", rev = "e478d834d7d3c482cba6af4a3fd1c60f7390ae89" }
nyx-plugin-host = { git = "https://github.com/design-nexus/nyx-core.git", rev = "e478d834d7d3c482cba6af4a3fd1c60f7390ae89" }
nyx-plugin-protocol = { git = "https://github.com/design-nexus/nyx-core.git", rev = "e478d834d7d3c482cba6af4a3fd1c60f7390ae89" }
nyx-plugin-view = { git = "https://github.com/design-nexus/nyx-design.git", rev = "aec4b032c92157cbcdc386aa97730f432300d5c4" }
nyx-providers = { path = "../../crates/nyx-providers" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "aec4b032c92157cbcdc386aa97730f432300d5c4" }
nyx-widgets = { path = "../../crates/nyx-widgets" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
