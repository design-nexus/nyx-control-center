[package]
name = "nyx-widgets"
version = "0.1.0"
description = "Nyx widget framework: live values, tile sizes and page layouts, shared by the Control Center and desktop widgets"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
nyx-config = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "f68ecc891cd0d5a36b6ed29e93ed5ffc52e77acc", features = ["watch"] }
serde = { version = "1", features = ["derive"] }
toml = "1"

[dev-dependencies]
tempfile = "3"
