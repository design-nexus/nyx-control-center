[package]
name = "nyx-providers"
version = "0.1.0"
description = "System data for Nyx widgets: network, Bluetooth, audio, power, media, Omarchy toggles"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
gio = "0.22"
glib = "0.22"
nyx-widgets = { path = "../nyx-widgets" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
